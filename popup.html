<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Just Scroll</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="mark">↓</span><span>JUST SCROLL</span><span class="version">v0.4</span></header>
<main><h1>Less nagging.<br>More browsing.</h1><p class="intro">Automatic login-prompt detection on every site.</p>
<section><span class="label">CURRENT SITE</span><strong id="host">Loading…</strong><label class="toggle"><span>Block login prompts</span><input id="enabled" type="checkbox" role="switch" disabled></label></section>
<button id="clean" disabled>Clean this page <span>↗</span></button><p id="status" role="status" aria-live="polite">Checking this page…</p>
<footer>Only clears overlays on loaded public content. Some sites still require an account to load more.</footer></main><script src="popup.js"></script></body></html>
